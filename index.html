<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Adventure - FEB</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <a href="#" class="btn home-btn" id="homeButton">
        <img src="COVER/gambar/home.png" alt="Home Button">
    </a>
    <a href="aboutus.html" class="btn about-btn" id="aboutButton">
        <img src="COVER/gambar/about.png" alt="About Button">
    </a>

    <!-- COVER SCREEN -->
    <div class="screen-container" id="coverScreen">
        <img src="COVER/gambar/cover.png" alt="UI Adventure Cover" class="screen-image cover-image">
        
        <a href="#" class="btn start-btn" id="startButton">
            <img src="COVER/gambar/start.png" alt="Start Button">
        </a>
    </div>

    <!-- LOADING SCREEN -->
    <div class="screen-container loading-container" id="loadingScreen">
        <p id="loadingText" class="pixel-text"></p>
        <img src="COVER/gambar/map.png" alt="Main Map Blurred" class="screen-image map-image map-blurred"> 
    </div>

    <!-- MAP SCREEN -->
    <div class="screen-container map-container" id="mapScreen">
        <img src="COVER/gambar/map.png" alt="Main Map Clear" class="screen-image map-image">
        
        <div class="map-hotspots">

            <!-- FT — langsung masuk -->
            <a href="teknik.html" class="hotspot ft-hotspot" data-fakultas="ft">
                <img src="COVER/gambar/fakultas/ft.png" alt="Karakter FT">
            </a>

            <!-- VOKASI — langsung masuk -->
            <a href="vokasi.html" class="hotspot vokasi-hotspot" data-fakultas="vokasi">
                <img src="COVER/gambar/fakultas/vokasi.png" alt="Karakter Vokasi">
            </a>

            <!-- FIA — langsung masuk -->
            <a href="fia.html" class="hotspot fia-hotspot" data-fakultas="fia">
                <img src="COVER/gambar/fakultas/fia.png" alt="Karakter FIA">
            </a>

            <!-- FEB — sekarang langsung masuk -->
            <a href="feb.html" class="hotspot feb-hotspot" data-fakultas="feb">
                <img src="COVER/gambar/fakultas/feb.png" alt="Karakter FEB">
            </a>

            <!-- Fakultas lain → popup Coming Soon -->
            <a href="#" class="hotspot fik-hotspot" data-fakultas="fik">
                <img src="COVER/gambar/fakultas/fik.png" alt="Karakter FIK">
            </a>
            <a href="#" class="hotspot fkm-hotspot" data-fakultas="fkm">
                <img src="COVER/gambar/fakultas/fkm.png" alt="Karakter FKM">
            </a>
            <a href="#" class="hotspot fmipa-hotspot" data-fakultas="fmipa">
                <img src="COVER/gambar/fakultas/fmipa.png" alt="Karakter FMIPA">
            </a>
            <a href="#" class="hotspot ff-hotspot" data-fakultas="ff">
                <img src="COVER/gambar/fakultas/ff.png" alt="Karakter FF">
            </a>
            <a href="#" class="hotspot fpsi-hotspot" data-fakultas="fpsi">
                <img src="COVER/gambar/fakultas/fpsi.png" alt="Karakter FPSI">
            </a>
            <a href="#" class="hotspot fisip-hotspot" data-fakultas="fisip">
                <img src="COVER/gambar/fakultas/fisip.png" alt="Karakter FISIP">
            </a>
            <a href="#" class="hotspot fh-hotspot" data-fakultas="fh">
                <img src="COVER/gambar/fakultas/fh.png" alt="Karakter FH">
            </a>
            <a href="#" class="hotspot fasilkom-hotspot" data-fakultas="fasilkom">
                <img src="COVER/gambar/fakultas/fasilkom.png" alt="Karakter FASILKOM">
            </a>
            <a href="#" class="hotspot fib-hotspot" data-fakultas="fib">
                <img src="COVER/gambar/fakultas/fib.png" alt="Karakter FIB">
            </a>
        </div>

        <!-- POPUP -->
        <div id="character-popup" class="character-popup-modal">
            <div class="popup-content">
                <button id="closePopupArrow" class="popup-close-arrow">
                    <img src="COVER/gambar/panah.png" alt="Close">
                </button>
                
                <img id="popup-image" src="" alt="Coming Soon" class="popup-image">
                <h3 id="popup-title"></h3>
            </div>
        </div>
    </div>
    
    <script>
    const coverScreen = document.getElementById('coverScreen');
    const loadingScreen = document.getElementById('loadingScreen');
    const mapScreen = document.getElementById('mapScreen');
    const startButton = document.getElementById('startButton');
    const homeButton = document.getElementById('homeButton');

    const loadingText = document.getElementById('loadingText');

    startButton.addEventListener('click', function(e) {
        e.preventDefault();
        coverScreen.style.display = 'none';
        loadingScreen.style.display = 'flex';
        loadingText.textContent = "LOADING....";

        setTimeout(() => {
            loadingText.textContent = "WELCOME TO THE ADVENTURE!";
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mapScreen.style.display = 'block';
            }, 1500);
        }, 1500);
    });

    homeButton.addEventListener('click', function(e) {
        e.preventDefault();
        loadingScreen.style.display = 'none';
        mapScreen.style.display = 'none';
        document.getElementById('character-popup').style.display = 'none';
        coverScreen.style.display = 'block';
    });

    loadingScreen.style.display = 'none';
    mapScreen.style.display = 'none';
    coverScreen.style.display = 'block';

    const hotspots = document.querySelectorAll('.hotspot');
    const popupModal = document.getElementById('character-popup');
    const closeBtnArrow = document.getElementById('closePopupArrow');
    const popupImage = document.getElementById('popup-image');
    const popupTitle = document.getElementById('popup-title');

    hotspots.forEach(hotspot => {
        hotspot.addEventListener('click', function(e) {
            const fakultasCode = this.dataset.fakultas;

            // FT, FIA, VOKASI, FEB → langsung hyperlink
            if (["fia","vokasi","ft","feb"].includes(fakultasCode)) return;

            // Fakultas lain → popup Coming Soon
            e.preventDefault();
            popupImage.src = "COVER/gambar/comingsoon.png";
            popupTitle.textContent = "Coming Soon";
            popupModal.style.display = 'block';
        });
    });

    closeBtnArrow.addEventListener('click', function() {
        popupModal.style.display = 'none';
    });

    window.addEventListener('click', function(e) {
        if (e.target === popupModal) {
            popupModal.style.display = 'none';
        }
    });
    </script>

</body>
</html>
